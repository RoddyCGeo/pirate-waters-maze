<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Safe Harbour — A Pirate Waters Maze</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Spectral:wght@400;500;600&family=Spectral+SC:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#071523;
    --navy:#0c2036;
    --navy-light:#163353;
    --parchment:#ecdfbd;
    --parchment-dark:#dccb9e;
    --ink:#2b2013;
    --gold:#c9a24b;
    --gold-bright:#e7c576;
    --teal:#1f5c5c;
    --danger:#7c2f2f;
    --danger-bright:#a94b41;
    --win:#2d6a4f;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(199,163,90,0.08), transparent 45%),
      radial-gradient(ellipse at 80% 90%, rgba(31,92,92,0.15), transparent 50%),
      linear-gradient(180deg, var(--navy-deep), var(--navy) 55%, var(--navy-light));
    color:var(--ink);
    font-family:'Spectral', serif;
    min-height:100vh;
    overflow-x:hidden;
  }
  .stage{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    position:relative;
  }
  /* ambient waves */
  .waves{
    position:fixed; left:0; right:0; bottom:0; height:140px;
    pointer-events:none; opacity:0.35; z-index:0;
  }
  .waves svg{width:100%; height:100%;}
  @media (prefers-reduced-motion: no-preference){
    .wave-path{ animation: drift 18s linear infinite; }
    .wave-path.slow{ animation-duration: 30s; opacity:0.6; }
  }
  @keyframes drift{
    from{ transform:translateX(0); }
    to{ transform:translateX(-400px); }
  }

  .compass{
    position:absolute; top:22px; left:22px; width:64px; height:64px;
    opacity:0.55; z-index:1;
  }
  @media (prefers-reduced-motion: no-preference){
    .compass{ animation: spin 140s linear infinite; }
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .card{
    position:relative; z-index:2;
    width:100%; max-width:640px;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.05), transparent 12%),
      var(--parchment);
    border-radius:6px;
    padding:34px 34px 30px;
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.35),
      0 30px 60px rgba(0,0,0,0.55),
      inset 0 0 60px rgba(120,90,40,0.12);
    background-image:
      repeating-linear-gradient(90deg, rgba(120,90,40,0.035) 0 1px, transparent 1px 90px),
      repeating-linear-gradient(0deg, rgba(120,90,40,0.035) 0 1px, transparent 1px 90px);
  }
  .card::before{
    content:"";
    position:absolute; inset:8px;
    border:1px solid rgba(120,90,40,0.35);
    border-radius:3px;
    pointer-events:none;
  }

  .eyebrow{
    font-family:'Spectral SC', serif;
    letter-spacing:0.22em;
    font-size:11.5px;
    color:var(--teal);
    text-transform:uppercase;
    margin:0 0 6px;
    text-align:center;
  }
  h1{
    font-family:'Pirata One', cursive;
    font-size:42px;
    letter-spacing:0.03em;
    color:var(--ink);
    text-align:center;
    margin:0 0 4px;
    line-height:1;
  }
  .subtitle{
    text-align:center;
    font-size:14.5px;
    color:#5a4b2e;
    margin:0 0 22px;
    font-style:italic;
  }

  /* voyage rail */
  .rail{
    display:flex; align-items:center; justify-content:center;
    gap:6px; margin:0 0 26px; flex-wrap:wrap;
    padding:10px 6px;
    background:rgba(11,31,51,0.06);
    border-radius:20px;
  }
  .station{
    width:22px; height:22px; border-radius:50%;
    border:2px solid rgba(43,32,19,0.35);
    background:rgba(255,255,255,0.4);
    display:flex; align-items:center; justify-content:center;
    font-size:10px; color:rgba(43,32,19,0.5);
    position:relative;
    flex-shrink:0;
    transition:all 0.35s ease;
  }
  .station.done{
    background:var(--teal); border-color:var(--teal); color:var(--parchment);
  }
  .station.current{
    background:var(--gold); border-color:var(--gold-bright);
    box-shadow:0 0 0 4px rgba(201,162,75,0.25);
    color:var(--ink);
  }
  .station.wrecked{
    background:var(--danger); border-color:var(--danger-bright); color:var(--parchment);
  }
  .station.harbour{ border-radius:6px; }
  .rail-link{
    width:12px; height:2px; background:rgba(43,32,19,0.25); flex-shrink:0;
  }

  .narrative{
    font-size:17px; line-height:1.55;
    color:var(--ink);
    margin:0 0 22px;
    min-height:96px;
  }
  .narrative .tag{
    display:inline-block;
    font-family:'Spectral SC', serif;
    font-size:11px; letter-spacing:0.14em;
    text-transform:uppercase;
    padding:2px 9px; border-radius:3px;
    margin-bottom:10px;
  }
  .tag.junction{ background:rgba(31,92,92,0.15); color:var(--teal); }
  .tag.hazard{ background:rgba(124,47,47,0.15); color:var(--danger); }
  .tag.win{ background:rgba(45,106,79,0.16); color:var(--win); }

  .choices{
    display:flex; gap:12px; justify-content:center; flex-wrap:wrap;
    margin-bottom:8px;
  }
  button.helm{
    font-family:'Spectral SC', serif;
    font-size:13px; letter-spacing:0.08em; text-transform:uppercase;
    padding:13px 20px;
    border-radius:5px;
    border:1px solid rgba(43,32,19,0.4);
    background:linear-gradient(180deg, #3a2c18, #241a0e);
    color:var(--parchment);
    cursor:pointer;
    min-width:140px;
    box-shadow:0 3px 0 rgba(0,0,0,0.4), 0 6px 14px rgba(0,0,0,0.25);
    transition:transform 0.12s ease, box-shadow 0.12s ease;
  }
  button.helm:hover{ transform:translateY(-2px); box-shadow:0 5px 0 rgba(0,0,0,0.4), 0 10px 18px rgba(0,0,0,0.3); }
  button.helm:active{ transform:translateY(1px); box-shadow:0 2px 0 rgba(0,0,0,0.4); }
  button.helm.port::before{ content:"◀ "; color:var(--gold-bright); }
  button.helm.straight::before{ content:"▲ "; color:var(--gold-bright); }
  button.helm.starboard::before{ content:"▶ "; color:var(--gold-bright); }

  .again{
    display:none; text-align:center; margin-top:6px;
    flex-direction:column; align-items:center; gap:10px;
  }
  button.restart{
    font-family:'Spectral SC', serif;
    font-size:12.5px; letter-spacing:0.1em; text-transform:uppercase;
    padding:10px 22px; border-radius:20px; cursor:pointer;
    border:1px solid var(--teal); background:transparent; color:var(--teal);
    display:block;
  }
  button.restart:hover{ background:var(--teal); color:var(--parchment); }
  button.restart.subtle{
    border:none; color:#8a7a56; font-size:11px; padding:2px 4px;
    text-decoration:underline; text-underline-offset:3px;
  }
  button.restart.subtle:hover{ background:transparent; color:var(--danger); }

  .footer-stats{
    display:flex; justify-content:space-between;
    font-size:12px; color:#6b5a38; margin-top:22px;
    border-top:1px solid rgba(43,32,19,0.15); padding-top:12px;
    font-family:'Spectral SC', serif; letter-spacing:0.05em;
  }

  .flash{ animation:none; }
  @media (prefers-reduced-motion: no-preference){
    .flash-hazard{ animation:shake 0.4s ease; }
    .flash-win{ animation:glow 1.2s ease; }
  }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-6px); }
    40%{ transform:translateX(5px); }
    60%{ transform:translateX(-3px); }
    80%{ transform:translateX(2px); }
  }
  @keyframes glow{
    0%{ box-shadow:0 0 0 1px rgba(0,0,0,0.35), 0 30px 60px rgba(0,0,0,0.55); }
    50%{ box-shadow:0 0 0 1px rgba(201,162,75,0.6), 0 30px 80px rgba(201,162,75,0.35); }
    100%{ box-shadow:0 0 0 1px rgba(0,0,0,0.35), 0 30px 60px rgba(0,0,0,0.55); }
  }

  @media (max-width:480px){
    h1{ font-size:34px; }
    .card{ padding:26px 18px 22px; }
    button.helm{ min-width:100px; font-size:11.5px; padding:12px 12px; }
  }
</style>
</head>
<body>

<svg class="compass" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <circle cx="50" cy="50" r="46" fill="none" stroke="#e7c576" stroke-width="2"/>
  <circle cx="50" cy="50" r="38" fill="none" stroke="#e7c576" stroke-width="1"/>
  <polygon points="50,8 56,50 50,92 44,50" fill="#e7c576"/>
  <polygon points="8,50 50,44 92,50 50,56" fill="#e7c576" opacity="0.6"/>
  <circle cx="50" cy="50" r="4" fill="#e7c576"/>
</svg>

<div class="waves">
  <svg viewBox="0 0 800 140" preserveAspectRatio="none">
    <path class="wave-path" d="M0,90 Q100,60 200,90 T400,90 T600,90 T800,90 T1000,90 T1200,90 V140 H0 Z" fill="#1f5c5c" opacity="0.5"/>
    <path class="wave-path slow" d="M0,110 Q100,85 200,110 T400,110 T600,110 T800,110 T1000,110 T1200,110 V140 H0 Z" fill="#0c2036" opacity="0.7"/>
  </svg>
</div>

<div class="stage">
  <div class="card" id="card">
    <p class="eyebrow" id="eyebrow">A Sailing Puzzle</p>
    <h1>Safe Harbour</h1>
    <p class="subtitle">Ten turns of the wheel stand between your ship and calm water. One wrong call — the shallows, the reef, the rocks, a wild current, or a pirate sail — ends the voyage.</p>

    <div class="rail" id="rail"></div>

    <div class="narrative" id="narrative"></div>

    <div class="choices" id="choices"></div>

    <div class="again" id="again">
      <button class="restart" id="retryBtn">⟲ Retry from Here</button>
      <button class="restart subtle" id="restartBtn">Restart the Whole Voyage</button>
    </div>

    <div class="footer-stats">
      <span id="attemptsStat">Attempts: 1</span>
      <span id="bestStat">Furthest reached: Junction 1 of 10</span>
    </div>
  </div>
</div>

<script>
const TOTAL = 10;

// Each junction: narrative text, and three options (port/straight/starboard).
// Each option: correct (bool) and, if wrong, a hazard {type, text}.
const junctions = [
{
text:"The Lady Eleanor has barely cleared the headland when the lookout cries, 'Sail astern!' A lean black brig is gaining fast. To port the water pales over hidden shoals, while to starboard the sea remains deep and blue. Captain Mercer turns calmly to Mr Wallace. 'Your helm?'",
correct:"starboard",
port:{type:"Shallows",text:"You edge toward the coast seeking shelter. The keel settles gently into sand. Behind you the pirate closes the distance until escape is impossible."},
straight:{type:"Rocks",text:"You hesitate, watching the pirate instead of the sea ahead. A hidden rocky shelf tears open the hull."}
},

{
text:"The pirate has matched your course. Ahead, white water marks a dangerous reef stretching across the obvious route. Mercer spots a narrow opening to port.",
correct:"port",
straight:{type:"Reef",text:"You steer directly toward the breaking water. Seconds later the reef splinters the bow."},
starboard:{type:"Current",text:"You avoid the reef only to enter a fierce tidal race. The current robs you of speed while the pirate gains."}
},

{
text:"Two rocky islands stand like sentries. Between them lies a deep-water passage scarcely wider than your ship. The pirate hesitates, unsure whether to follow.",
correct:"straight",
port:{type:"Rocks",text:"You favour the western island. Hidden rocks extend far beneath the surface and bring the voyage to an abrupt end."},
starboard:{type:"Shallows",text:"You swing toward the eastern island and run aground on a broad gravel shoal."}
},

{
text:"A warning cannon echoes across the sea. The pirate captain wants you frightened. At that moment a fresh breeze fills from the port quarter. Mercer smiles. 'Now we shall see who truly understands the wind.'",
correct:"starboard",
port:{type:"Pirates",text:"Turning to port carries you directly across the pirate's bow. Grappling hooks bite into the rail."},
straight:{type:"Reef",text:"Your eyes remain fixed on the pirate while an unseen reef waits directly ahead."}
},

{
text:"An old black navigation buoy rises from the swell. Mercer quietly recalls a pilot's saying: 'Leave the black buoy to starboard, and you'll live to tell the tale.'",
correct:"port",
straight:{type:"Reef",text:"You ignore the old saying. The reef proves the pilot was wiser than you."},
starboard:{type:"Rocks",text:"Passing the buoy on the wrong side leads straight onto submerged rocks."}
},

{
text:"Dark clouds gather. Rain begins to fall. The pirate brig shortens sail, unwilling to risk the approaching squall, but Mercer presses onward through the deep-water channel.",
correct:"straight",
port:{type:"Current",text:"Seeking calmer water, you stray into a swirling eddy that leaves the ship helpless."},
starboard:{type:"Rocks",text:"The edge of the channel hides a rocky ledge beneath the waves."}
},

{
text:"The storm now hides both ships from one another. Lightning flashes on the port horizon. Mercer knows one bold decision could finally shake the pirate's pursuit.",
correct:"starboard",
port:{type:"Pirates",text:"The rain suddenly clears. The pirate emerges almost alongside and boards before you can escape."},
straight:{type:"Shallows",text:"You hold your course into water that is far shallower than the charts suggested."}
},

{
text:"The harbour coast comes into view, protected by reefs known only to local captains, and dark, murky waters to starboard. Mercer trusts memory more than sight. 'Follow the blue water, Mr Wallace.'",
correct:"port",
straight:{type:"Rocks",text:"You cut the corner too tightly and strike the headland."},
starboard:{type:"Reef",text:"You stand too far offshore and meet the outer reef instead."}
},

{
text:"The harbour lights flicker through the mist. Only one narrow channel remains. Strong tidal currents swirl on both sides, eager to drag careless ships back to sea.",
correct:"straight",
port:{type:"Shallows",text:"You stray from the channel and settle gently onto the mud, within sight of safety."},
starboard:{type:"Current",text:"The ebb tide seizes the ship and sweeps her back toward the waiting pirate."}
},

{
text:"The harbour guns stand ahead. The pirate brig slows, unwilling to challenge the batteries guarding the entrance. Mercer removes his hat and quietly gives one final order.",
correct:"starboard",
port:{type:"Rocks",text:"One last mistake, within sight of home. The harbour rocks claim the Lady Eleanor."},
straight:{type:"Reef",text:"A submerged training wall lies hidden beneath the surface. Safe harbour was only yards away."}
}
];

const winText =
"The Lady Eleanor glides safely between the harbour heads as the pirate brig turns away beyond the guns. Captain Mercer smiles at Mr Wallace before writing a single line in the ship's log: 'The greatest victory is the battle you never have to fight.'  Your cache coordinates are S27° 02.027  E153° 04.476";
let current = 1;      // junction number, 1-indexed
let attempts = 1;
let best = 1;
let wreckedAt = null; // junction number where current attempt failed, for rail marking

function renderRail(){
  const rail = document.getElementById('rail');
  rail.innerHTML = '';
  for(let i=1;i<=TOTAL;i++){
    const st = document.createElement('div');
    st.className = 'station';
    if(i === TOTAL && current > TOTAL){
      st.classList.add('harbour');
      st.textContent = '⚓';
    } else if(wreckedAt === i){
      st.classList.add('wrecked');
      st.textContent = '×';
    } else if(i < current){
      st.classList.add('done');
      st.textContent = '✓';
    } else if(i === current){
      st.classList.add('current');
      st.textContent = i;
    } else {
      st.textContent = i;
    }
    rail.appendChild(st);
    if(i < TOTAL){
      const link = document.createElement('div');
      link.className = 'rail-link';
      rail.appendChild(link);
    }
  }
}

function renderStats(){
  document.getElementById('attemptsStat').textContent = `Attempts: ${attempts}`;
  document.getElementById('bestStat').textContent = best > TOTAL
    ? `Furthest reached: Safe Harbour`
    : `Furthest reached: Junction ${best} of ${TOTAL}`;
}

function renderJunction(){
  wreckedAt = null;
  const card = document.getElementById('card');
  card.classList.remove('flash-hazard','flash-win');
  const j = junctions[current-1];
  document.getElementById('eyebrow').textContent = `Junction ${current} of ${TOTAL}`;
  document.getElementById('narrative').innerHTML =
    `<span class="tag junction">Decision point</span><br>${j.text}`;

  const choices = document.getElementById('choices');
  choices.innerHTML = '';
  const opts = [
    {key:'port', label:'Port'},
    {key:'straight', label:'Straight Ahead'},
    {key:'starboard', label:'Starboard'}
  ];
  opts.forEach(o=>{
    const b = document.createElement('button');
    b.className = `helm ${o.key}`;
    b.textContent = o.label;
    b.onclick = () => choose(o.key);
    choices.appendChild(b);
  });
  document.getElementById('again').style.display = 'none';
  renderRail();
  renderStats();
}

function choose(key){
  const j = junctions[current-1];
  const card = document.getElementById('card');
  if(key === j.correct){
    current++;
    if(current > best) best = current;
    if(current > TOTAL){
      renderWin();
    } else {
      renderJunction();
    }
  } else {
    wreckedAt = current;
    const hazard = j[key];
    document.getElementById('eyebrow').textContent = `Junction ${current} of ${TOTAL} — Voyage Ended`;
    document.getElementById('narrative').innerHTML =
      `<span class="tag hazard">${hazard.type}</span><br>${hazard.text}`;
    document.getElementById('choices').innerHTML = '';
    document.getElementById('retryBtn').style.display = 'block';
    document.getElementById('retryBtn').textContent = '⟲ Retry from Here';
    document.getElementById('restartBtn').textContent = 'Restart the Whole Voyage';
    document.getElementById('again').style.display = 'flex';
    renderRail();
    renderStats();
    card.classList.add('flash-hazard');
  }
}

function renderWin(){
  const card = document.getElementById('card');
  document.getElementById('eyebrow').textContent = `Voyage Complete`;
  document.getElementById('narrative').innerHTML =
    `<span class="tag win">Safe Harbour</span><br>${winText}`;
  document.getElementById('choices').innerHTML = '';
  document.getElementById('retryBtn').style.display = 'none';
  document.getElementById('restartBtn').textContent = '⟲ Sail Again';
  document.getElementById('again').style.display = 'flex';
  renderRail();
  renderStats();
  card.classList.add('flash-win');
}

document.getElementById('retryBtn').onclick = () => {
  attempts++;
  renderJunction();
};

document.getElementById('restartBtn').onclick = () => {
  current = 1;
  attempts++;
  renderJunction();
};

renderJunction();
</script>

</body>
</html>
